<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Obsidian - Add Transaction</title>

                        "inverse-surface": "#fcf9f8",

                        "surface-container-low": "#131313",

                        "label": ["Inter"]

                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "1.5rem", "full": "9999px"},

<style>
        .glass-panel {
            background: rgba(38, 38, 38, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-transparent backdrop-blur-xl z-50 flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-highest flex items-center justify-center">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="Professional male portrait for user profile" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZLruV90Y_hj0ctqDriwSmPMhEJmSl43iAg7iP81zbcouV6FB-DqXpSWlZiKq0b1aQ8OKq_Rk4dgumDp1Trh82gZABqHF0ryzsJ2nCX_PYjwo_9uR7PGqA72C_DJ67V3-nQbpUhl_VkFoL3M_fXRONE_1kacmRT2WKyRsGkZUx_nPFlp1emH_VGbjaeq7gCdeSv7RftD3vpVe6swrJ0c7BxdrQnufMPdbrZli6ewwGgGTmCx8KUuR6w8njI5ECW50SUQDl2VpxNyE"/>
</div>
<h1 class="font-manrope font-bold text-xl text-white tracking-tight">Obsidian</h1>
</div>
<div class="flex items-center gap-4">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-[#adaaaa] hover:bg-[#262626] transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-6 max-w-2xl mx-auto w-full">
<!-- Page Header -->
<div class="mb-10 text-center md:text-left">
<h2 class="font-headline text-4xl font-extrabold tracking-tight mb-2">New Transaction</h2>
<p class="text-on-surface-variant text-lg">Log your spending or earnings with precision.</p>
</div>
<!-- Transaction Form (Glassmorphism) -->
<div class="glass-panel p-8 rounded-xl space-y-8 shadow-[0_20px_50px_rgba(0,0,0,0.3)]">
<!-- Type Toggle -->
<div class="flex p-1 bg-surface-container-lowest rounded-full w-fit mx-auto md:mx-0">
<button class="px-8 py-2 rounded-full text-sm font-semibold bg-surface-container-highest text-primary transition-all">Expense</button>
<button class="px-8 py-2 rounded-full text-sm font-semibold text-on-surface-variant hover:text-on-surface transition-all">Income</button>
</div>
<!-- Amount Input -->
<div class="space-y-2">
<label class="font-label text-xs uppercase tracking-widest text-on-surface-variant ml-1">Amount</label>
<div class="relative group">
<span class="absolute left-6 top-1/2 -translate-y-1/2 text-3xl font-bold text-primary">$</span>
<input class="w-full bg-surface-container-highest border-none rounded-xl py-6 pl-12 pr-6 text-4xl font-bold focus:ring-2 focus:ring-primary/20 placeholder:text-surface-variant transition-all" placeholder="0.00" type="number"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Category -->
<div class="space-y-2">
<label class="font-label text-xs uppercase tracking-widest text-on-surface-variant ml-1">Category</label>
<div class="relative">
<select class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-6 text-on-surface appearance-none focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer">
<option>Food &amp; Drinks</option>
<option>Transportation</option>
<option>Entertainment</option>
<option>Shopping</option>
<option>Utilities</option>
<option>Health</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Date -->
<div class="space-y-2">
<label class="font-label text-xs uppercase tracking-widest text-on-surface-variant ml-1">Date</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-6 text-on-surface focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer [color-scheme:dark]" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">calendar_today</span>
</div>
</div>
</div>
<!-- Description -->
<div class="space-y-2">
<label class="font-label text-xs uppercase tracking-widest text-on-surface-variant ml-1">Description</label>
<textarea class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-6 text-on-surface focus:ring-2 focus:ring-primary/20 placeholder:text-on-surface-variant/40 transition-all resize-none" placeholder="What was this for?" rows="3"></textarea>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full py-5 bg-primary text-on-primary font-headline font-bold text-lg rounded-full shadow-[0_10px_30px_rgba(104,211,255,0.3)] hover:shadow-[0_15px_40px_rgba(104,211,255,0.5)] hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
                    Add Transaction
                </button>
</div>
</div>
<!-- Quick Suggestions (Asymmetric Layout Element) -->
<div class="mt-12 flex flex-wrap gap-3 justify-center md:justify-start">
<span class="text-xs uppercase tracking-widest text-on-surface-variant w-full mb-2 ml-1">Quick Add Tags</span>
<button class="px-5 py-2 rounded-full border border-outline-variant/20 hover:bg-surface-container-highest text-sm transition-all">Coffee</button>
<button class="px-5 py-2 rounded-full border border-outline-variant/20 hover:bg-surface-container-highest text-sm transition-all">Grocery</button>
<button class="px-5 py-2 rounded-full border border-outline-variant/20 hover:bg-surface-container-highest text-sm transition-all">Rent</button>
<button class="px-5 py-2 rounded-full border border-outline-variant/20 hover:bg-surface-container-highest text-sm transition-all">Subscription</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-2 bg-[#1a1a1a]/80 backdrop-blur-2xl rounded-t-[2rem] shadow-[0_-20px_40px_rgba(0,0,0,0.4)]">
<div class="flex flex-col items-center justify-center text-[#adaaaa] p-3 hover:text-white transition-all active:scale-90 duration-300">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-inter text-[10px] font-medium uppercase tracking-wider mt-1">Dashboard</span>
</div>
<div class="flex flex-col items-center justify-center text-[#adaaaa] p-3 hover:text-white transition-all active:scale-90 duration-300">
<span class="material-symbols-outlined">history</span>
<span class="font-inter text-[10px] font-medium uppercase tracking-wider mt-1">History</span>
</div>
<div class="flex flex-col items-center justify-center text-[#68d3ff] bg-[#262626] rounded-full p-4 -mt-8 shadow-xl active:scale-90 duration-300">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-inter text-[10px] font-medium uppercase tracking-wider mt-1">Add</span>
</div>
<div class="flex flex-col items-center justify-center text-[#adaaaa] p-3 hover:text-white transition-all active:scale-90 duration-300">
<span class="material-symbols-outlined">settings</span>
<span class="font-inter text-[10px] font-medium uppercase tracking-wider mt-1">Settings</span>
</div>
</nav>
</body></html>
